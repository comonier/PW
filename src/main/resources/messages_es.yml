  discord-announcement-title: "¡Nuevo Warp Creado!"
  discord-announcement-desc: "El jugador **{player}** creó un nuevo warp: **/pw {warp}**"
  discord-teleport-title: "Teletransporte Realizado"
  discord-teleport-desc: "El jugador **{player}** viajó al warp: **{warp}**"
  discord-delete-title: "Warp Eliminado"
  discord-delete-desc: "El jugador **{player}** eliminó el warp: **{warp}**"

  # Tutoriales de Edición
  edit-name-tutorial:
    - "&bPara cambiar el nombre del warp, escribe el comando:"
    - "&a/pwsetname <old_warpname> <new_warpname>"
    - "&2old_warpname es el nombre actual"
    - "&2new_warpname es el nuevo nombre"
    - "&fPermiso: &epw.setname"
  
  edit-lore-tutorial:
    - "&bPara cambiar la descripción, escribe el comando:"
    - "&a/pwsetlore <warp_name> <mensaje formateado>"
    - "&2Puedes usar códigos de colores, ej: &7/pw &bxp"
    - "&2Puedes configurar más líneas usando , o ;"
    - "&fPermiso: &epw.setlore"

  edit-icon-tutorial:
    - "&bPara cambiar el icono, escribe el comando:"
    - "&a/pwseticon <warp_name> &7con un objeto en la mano"
    - "&fPermiso: &epw.seticon"

  edit-remove-tutorial:
    - "&bPara eliminar tu warp, escribe el comando:"
    - "&c/pwdel <warp_name> confirm"
    - "&fPermiso: &epw.del"

  success:
    name-changed: "&aNombre cambiado con éxito."
    lore-changed: "&aDescripción cambiada con éxito."
    icon-changed: "&aIcono cambiado con éxito."
    location-reset: "&aUbicación restablecida con éxito."
    warp-removed: "&aWarp eliminada con éxito."
    warp-locked: "&cWarp bloqueada con éxito."
    warp-unlocked: "&aWarp desbloqueada con éxito."

# Configurações de Interface (GUI) do PW
# Slots e itens configuráveis para os menus principais e de busca

menus:
  main:
    title: "&8Player Warps - Principal"
    size: 54
    # Slots de borda (Painel de vidro preto)
    filler:
      material: BLACK_STAINED_GLASS_PANE
      slots: [1, 2, 3, 4, 5, 6, 9, 17, 18, 26, 27, 35, 36, 44, 46, 47, 48, 49, 50, 51, 52]

    # Slot 0: Cabeça do Jogador (Suas Warps)
    player-profile:
      slot: 0
      name: "&aSuas Warps"
      lore:
        - "&7Clique para gerenciar ou ver"
        - "&7as suas próprias warps criadas."

    # Slot 7: Busca por Nome da Warp
    search-warp:
      slot: 7
      material: COMPASS
      name: "&bBuscar por Nome"
      lore:
        - "&7Classificado por: &fVisitas/Data"
        - ""
        - "&eClique para filtrar."

    # Slot 8: Busca por Jogador
    search-player:
      slot: 8
      material: PLAYER_HEAD
      name: "&eBuscar por Jogadores"
      lore:
        - "&7Mostra os donos das warps"
        - "&7mais populares primeiro."
        - ""
        - "&eClique para filtrar."

  edit-panel:
    title: "&8Editando Warp: {warp_name}"
    size: 54
    # Estrutura de design conforme solicitado (vidro cinza escuro, claro e preto)
    design:
      black-filler:
        material: BLACK_STAINED_GLASS_PANE
        slots: [0, 8, 45, 53]
      dark-gray-filler:
        material: GRAY_STAINED_GLASS_PANE
        slots: [1, 2, 3, 4, 5, 6, 7, 9, 17, 18, 26, 27, 35, 36, 44, 46, 47, 48, 49, 50, 51, 52, 19, 20, 21, 22, 23, 24, 25]
      light-gray-filler:
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        slots: [10, 11, 12, 14, 15, 16, 29, 31, 33, 38, 40, 42]

    # Slot 13: Exibição do Ícone Atual (Não clicável)
    current-icon:
      slot: 13

    # Botões de Ação
    actions:
      teleport:
        slot: 28
        material: ENDER_PEARL
        name: "&aTeleportar"
        lore: ["&7Teleporte-se para a Warp"]
      reset:
        slot: 30
        material: RED_BED
        name: "&eResetar"
        lore: ["&7Setar novo local da Warp"]
      name:
        slot: 32
        material: NAME_TAG
        name: "&bNome"
        lore: ["&7Alterar nome da Warp"]
      lore:
        slot: 34
        material: ENCHANTED_BOOK
        name: "&dLore"
        lore: ["&7Alterar lore da Warp"]
      back:
        slot: 37
        material: PLAYER_HEAD
        name: "&6Voltar"
        lore: ["&7Volta ao Menu Principal"]
      icon:
        slot: 39
        name: "&9Ícone"
        lore: ["&7Alterar ícone da Warp"]
      lock:
        slot: 41
        material: IRON_DOOR
        name: "&fTrancar/Destrancar"
        lore: ["&7Estado atual: {status}"]
      remove:
        slot: 43
        material: BARRIER
        name: "&cRemover"
        lore: ["&7Remove a Warp permanentemente"]

# Configurações de slots de warps (Grid 10 ao 43)
warp-grid:
  start: 10
  end: 43
  locked-material: RED_STAINED_GLASS_PANE
  empty-material: WHITE_STAINED_GLASS_PANE

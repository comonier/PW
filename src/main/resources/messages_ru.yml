# Русские сообщения
messages:
  prefix: "&b&lPW &8» "
  no-permission: "&cУ вас нет разрешения: {permission} или pw.use."
  permission-denied-admin: "&cРазрешение {permission} было отклонено администратором."
  warp-not-found: "&cВарп не найден."
  limit-reached: "&cВы достигли лимита в {limit} варпов. Повысьте статус!"
  unsafe-location: "&cЭто место небезопасно или недоступно для варпа!"
  no-build-permission: "&cУ вас нет прав на строительство в этом регионе!"
  warp-exists: "&cВарп с таким именем уже существует!"
  warp-created: "&aВарп '&f{warp}&a' успешно создан!"
  warp-deleted: "&aВарп успешно удален."
  warp-auto-locked: "&cВарп заблокирован: Регион удален или место небезопасно."
  warp-locked-error: "&cЭтот варп заблокирован владельцем."
  warp-teleport: "&aВы телепортировались на варп &f{warp}&a."
  
  # Глобальные объявления
  broadcast-create: "&b&lPW &8» &f{player} &7создал варп &b/pw {warp}"
  broadcast-delete: "&b&lPW &8» &7Варп &f{warp} &7был удален игроком &f{player}"
  broadcast-teleport: "&b&lPW &8» &f{player} &7отправился на варп &b{warp}"

  # Обучение редактированию
  edit-name-tutorial:
    - "&eL1: Чтобы изменить название варпа, введите команду:"
    - "&eL2: &b/pwsetname <старое_имя> <новое_имя>"
    - "&eL3: &7старое_имя - текущее название"
    - "&eL4: &7новое_имя - новое название"
    - "&eL5: &8Разрешение: pw.setname"
  
  edit-lore-tutorial:
    - "&eL1: Чтобы изменить описание, введите команду:"
    - "&eL2: &b/pwsetlore <имя_варпа> <текст>"
    - "&eL3: &7Вы можете использовать цветовые коды, например: &7/pw &bxp"
    - "&eL4: &7Вы можете добавить новые строки через , или ;"
    - "&eL5: &8Разрешение: pw.setlore"

  edit-icon-tutorial:
    - "&eL1: Чтобы изменить иконку, введите команду:"
    - "&eL2: &b/pwseticon <имя_варпа> &7держа предмет в руке"
    - "&eL3: &8Разрешение: pw.seticon"

  edit-remove-tutorial:
    - "&eL1: Чтобы удалить варп, введите команду:"
    - "&eL2: &c/pwdel <имя_варпа> confirm"
    - "&eL3: &8Разрешение: pw.del"

  success:
    name-changed: "&aНазвание успешно изменено."
    lore-changed: "&aОписание успешно изменено."
    icon-changed: "&aИконка успешно изменена."
    location-reset: "&aТочка варпа успешно обновлена."
    warp-removed: "&aВарп успешно удален."
    warp-locked: "&cВарп заблокирован."
    warp-unlocked: "&aВарп разблокирован."

# PW - Player Warps Configuration
# Compatible with 1.19, 1.20, 1.21 and 26.1+ (Folia/Paper/Spigot)

settings:
  language: "pt"
  default-warp-icon: "PLAYER_HEAD"
  default-sorting: "VISITS"
  teleport-delay: 3
  default-warp-limit: 5

announcements:
  global-chat: true
  discord:
    enabled: false
    webhook-url: "https://discord.com"
    username: "Player Warps"
    avatar-url: "https://imgur.com"
    color: 65280

database:
  type: "SQLITE"
  host: "localhost"
  port: "3306"
  name: "minecraft"
  user: "root"
  password: ""

navigation:
  previous-page-material: "ARROW"
  next-page-material: "ARROW"

permissions:
  use-all: "pw.use"
  admin: "pw.admin"
  edit: "pw.edit"
  tp: "pw.tp"
  reset: "pw.reset"
  setname: "pw.setname"
  setlore: "pw.setlore"
  seticon: "pw.seticon"
  lock: "pw.lock"
  delete: "pw.del"
  set: "pw.set"

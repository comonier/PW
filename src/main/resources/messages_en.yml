  gui-previous-page-name: "&aPrevious Page"
  gui-previous-page-lore: ["&7Click to go back"]
  gui-next-page-name: "&aNext Page"
  gui-next-page-lore: ["&7Click to advance"]
  
  discord-announcement-title: "New Warp Created!"
  discord-announcement-desc: "Player **{player}** created a new warp: **/pw {warp}**"
  discord-teleport-title: "Teleport Notice"
  discord-teleport-desc: "Player **{player}** traveled to warp: **{warp}**"
  discord-delete-title: "Warp Removed"
  discord-delete-desc: "Player **{player}** deleted warp: **{warp}**"

  edit-name-tutorial:
    - "&eL1: To change the warp name, type the command below:"
    - "&eL2: &b/pwsetname <old_warpname> <new_warpname>"
    - "&eL5: &8Permission: pw.setname"
  edit-lore-tutorial:
    - "&eL1: To change the warp lore, type the command below:"
    - "&eL2: &b/pwsetlore <warp_name> <formatted message>"
    - "&eL5: &8Permission: pw.setlore"
  edit-icon-tutorial:
    - "&eL1: To change the warp icon, type the command below:"
    - "&eL2: &b/pwseticon <warp_name> &7holding an item"
    - "&eL3: &8Permission: pw.seticon"
  edit-remove-tutorial:
    - "&eL1: To remove your warp, type the command below:"
    - "&eL2: &c/pwdel <warp_name> confirm"
    - "&eL3: &8Permission: pw.del"

  success:
    name-changed: "&aWarp name changed successfully."
    lore-changed: "&aLore changed successfully."
    icon-changed: "&aIcon changed successfully."
    location-reset: "&aWarp location reset successfully."
    warp-removed: "&aWarp removed successfully."
    warp-locked: "&cWarp locked successfully."
    warp-unlocked: "&aWarp unlocked successfully."
